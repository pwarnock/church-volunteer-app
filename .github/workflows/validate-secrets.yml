name: Validate Required Secrets

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets before deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          ADMIN_SEED_TOKEN: ${{ secrets.ADMIN_SEED_TOKEN }}
        run: |
          MISSING_SECRETS=()
          
          [[ -z "$VERCEL_TOKEN" ]] && MISSING_SECRETS+=("VERCEL_TOKEN")
          [[ -z "$VERCEL_ORG_ID" ]] && MISSING_SECRETS+=("VERCEL_ORG_ID")
          [[ -z "$VERCEL_PROJECT_ID" ]] && MISSING_SECRETS+=("VERCEL_PROJECT_ID")
          [[ -z "$NEXTAUTH_SECRET" ]] && MISSING_SECRETS+=("NEXTAUTH_SECRET")
          [[ -z "$NEXTAUTH_URL" ]] && MISSING_SECRETS+=("NEXTAUTH_URL")
          [[ -z "$ADMIN_SEED_TOKEN" ]] && MISSING_SECRETS+=("ADMIN_SEED_TOKEN")
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Missing required secrets:"
            printf '%s\n' "${MISSING_SECRETS[@]}" | sed 's/^/  - /'
            echo ""
            echo "Add them at: https://github.com/pwarnock/church-volunteer-app/settings/secrets/actions"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"
          
          # Validate NEXTAUTH_SECRET length
          if [[ ${#NEXTAUTH_SECRET} -lt 32 ]]; then
            echo "❌ NEXTAUTH_SECRET must be at least 32 characters"
            exit 1
          fi
          
          echo "✅ NEXTAUTH_SECRET meets minimum length requirement"
