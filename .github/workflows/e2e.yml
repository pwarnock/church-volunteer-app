name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      test_category:
        description: 'Test category to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - core
          - full
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Build application
        run: bun run build

      - name: Run Smoke Tests
        if: github.event.inputs.test_category == 'smoke'
        run: bun test:e2e e2e/smoke.spec.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.inputs.environment == 'production' && secrets.PROD_URL || 'https://staging-church-volunteer.vercel.app' }}

      - name: Run Core E2E Tests
        if: github.event.inputs.test_category == 'core'
        run: bun test:e2e e2e/auth.spec.ts e2e/opportunities.spec.ts e2e/application-management.spec.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.inputs.environment == 'production' && secrets.PROD_URL || 'https://staging-church-volunteer.vercel.app' }}

      - name: Run Full E2E Tests
        if: github.event.inputs.test_category == 'full'
        run: bun test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.inputs.environment == 'production' && secrets.PROD_URL || 'https://staging-church-volunteer.vercel.app' }}

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.event.inputs.test_category }}
          path: playwright-report/
          retention-days: 7
