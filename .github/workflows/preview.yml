name: Deploy Preview

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          # Validate required environment variables
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "ERROR: VERCEL_ORG_ID is not set"
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ERROR: VERCEL_PROJECT_ID is not set"
            exit 1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is not set"
            exit 1
          fi

          bun install -g vercel
          echo "=== Starting Vercel Deployment ==="
          echo "Organization: $VERCEL_ORG_ID"
          echo "Project: $VERCEL_PROJECT_ID"

          # Run deployment with timeout and debug output
          set +e
          timeout 60 vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | tee vercel-output.txt
          DEPLOYMENT_EXIT_CODE=$?
          set -e

          echo "=== Deployment Exit Code: $DEPLOYMENT_EXIT_CODE ==="
          echo "=== Vercel Output ==="
          cat vercel-output.txt
          echo "=== End of Output ==="

          if [ $DEPLOYMENT_EXIT_CODE -ne 0 ]; then
            if [ $DEPLOYMENT_EXIT_CODE -eq 124 ]; then
              echo "ERROR: Vercel deployment timed out after 60 seconds"
            else
              echo "ERROR: Vercel deployment failed with exit code $DEPLOYMENT_EXIT_CODE"
            fi
            exit 1
          fi

          DEPLOYMENT_URL=$(cat vercel-output.txt | grep -oP 'https://[a-zA-Z0-9\-]+\.(vercel\.app|now\.sh|[a-zA-Z0-9\-]+\.[a-zA-Z]{2,})' | head -1 || echo "")
          if [ -z "$DEPLOYMENT_URL" ] || [ "$DEPLOYMENT_URL" = "https://vercel" ] || [[ "$DEPLOYMENT_URL" == *"vercel.com"* ]]; then
            echo "=== Attempting JSON output parsing ==="
            timeout 60 vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes --json 2>&1 | tee vercel-json.txt
            DEPLOYMENT_URL=$(cat vercel-json.txt | jq -r '.url // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$DEPLOYMENT_URL" ] || [ "$DEPLOYMENT_URL" = "https://vercel" ] || [[ "$DEPLOYMENT_URL" == *"vercel.com"* ]]; then
            echo "=== Attempting inspect fallback ==="
            timeout 60 vercel inspect --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee vercel-inspect.txt
            DEPLOYMENT_URL=$(cat vercel-inspect.txt | jq -r '.url // empty' 2>/dev/null || echo "")
          fi

          # Validate final URL
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "ERROR: Failed to extract deployment URL from Vercel output"
            echo "Check Vercel dashboard for build errors"
            exit 1
          fi

          echo "=== Final Deployment URL: $DEPLOYMENT_URL ==="
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30

      - name: Run Enhanced Preview Tests
        id: preview-tests
        run: |
          bun run test:preview "${{ steps.deploy.outputs.url }}" || echo "tests_failed=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}

      - name: Comment PR with Test Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const previewUrl = '${{ steps.deploy.outputs.url }}';
            const testsFailed = '${{ steps.preview-tests.outputs.tests_failed }}' === 'true';

            let commentBody = `## 🚀 Preview Deployment & Testing\n\n`;
            commentBody += `**Preview URL:** ${previewUrl}\n\n`;

            if (testsFailed) {
              commentBody += `### ❌ Preview Tests Failed\n\n`;
              commentBody += `The preview deployment failed one or more critical tests. Please review the test results and fix the issues before merging.\n\n`;
              commentBody += `**Next Steps:**\n`;
              commentBody += `1. Check the deployment logs for errors\n`;
              commentBody += `2. Review the test failure details\n`;
              commentBody += `3. Fix the issues and push a new commit\n\n`;
              commentBody += `🚫 **This PR cannot be merged until tests pass**`;
            } else {
              commentBody += `### ✅ All Preview Tests Passed\n\n`;
              commentBody += `The preview deployment passed all critical tests:\n`;
              commentBody += `- ✅ Health check\n`;
              commentBody += `- ✅ Smoke tests\n`;
              commentBody += `- ✅ API endpoint tests\n`;
              commentBody += `- ✅ User flow tests\n\n`;
              commentBody += `🎉 **This PR is ready for review and merge**`;
            }

            commentBody += `\n---\n*Generated at: ${new Date().toISOString()}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Fail PR if Tests Failed
        if: steps.preview-tests.outputs.tests_failed == 'true'
        run: |
          echo "❌ Preview tests failed - blocking merge"
          exit 1
